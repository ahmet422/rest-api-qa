# Scans git history for leaked credentials (best-effort; not a substitute for secret management).
name: Secret scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
