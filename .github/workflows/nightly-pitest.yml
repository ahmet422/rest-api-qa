# Mutation testing (PIT) on a schedule — slower than normal CI; see Course Reference → CI/CD.
name: Nightly mutation tests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  pitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run PIT (profile pitest)
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage -Ppitest

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/
