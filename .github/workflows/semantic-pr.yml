# Encourages Conventional Commits-style PR titles (e.g. feat:, fix:, chore:).
# Disable this workflow if your course does not require title conventions.
name: Semantic PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, master]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
