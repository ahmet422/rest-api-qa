# Flags vulnerable dependency changes on pull requests (requires Dependency graph).
#
# This job is OFF by default so forks/repos without Dependency graph don't get red CI.
# To enable:
#   1. Repo Settings → Security → Enable "Dependency graph"
#      https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-the-dependency-graph
#   2. Repo Settings → Secrets and variables → Actions → Variables → New repository variable:
#      Name: ENABLE_DEPENDENCY_REVIEW   Value: true
#
name: Dependency review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
