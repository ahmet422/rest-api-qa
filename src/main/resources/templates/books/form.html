<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${editMode} ? 'Edit book' : 'New book', ~{::main})}">
<body>
<main th:fragment="main">
    <h1 class="app-page-title h3 mb-4" th:text="${editMode} ? 'Edit book' : 'Add a new book'">Form</h1>
    <div class="app-form-card">
        <form th:object="${bookForm}"
              th:action="${editMode} ? @{/books/{id}/edit(id=${editId})} : @{/books}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="title">Title</label>
                <input id="title" class="form-control" th:field="*{title}"
                       th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="author">Author</label>
                <input id="author" class="form-control" th:field="*{author}"
                       th:classappend="${#fields.hasErrors('author')} ? ' is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{author}"></div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="category">Category</label>
                    <select id="category" class="form-select" required th:field="*{category}"
                            th:classappend="${#fields.hasErrors('category')} ? ' is-invalid'">
                        <option value="">Select category…</option>
                        <option th:each="c : ${catalogCategories}" th:value="${c}" th:text="${c}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{category}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="language">Language</label>
                    <select id="language" class="form-select" required th:field="*{language}"
                            th:classappend="${#fields.hasErrors('language')} ? ' is-invalid'">
                        <option value="">Select language…</option>
                        <option th:each="lang : ${catalogLanguages}" th:value="${lang}" th:text="${lang}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{language}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="isbn">ISBN <span class="text-muted fw-normal">(optional)</span></label>
                <input id="isbn" class="form-control" th:field="*{isbn}"
                       th:classappend="${#fields.hasErrors('isbn')} ? ' is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{isbn}"></div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="price">Price (USD)</label>
                    <input id="price" type="number" step="0.01" min="0" class="form-control" th:field="*{price}"
                           th:classappend="${#fields.hasErrors('price')} ? ' is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{price}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="stock">Stock</label>
                    <input id="stock" type="number" min="0" class="form-control" th:field="*{stock}"
                           th:classappend="${#fields.hasErrors('stock')} ? ' is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{stock}"></div>
                </div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-primary px-4 rounded-pill" th:text="${editMode} ? 'Save changes' : 'Create book'">
                    Submit
                </button>
                <a class="btn btn-outline-secondary rounded-pill" th:href="@{/books}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
