<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Book detail', ~{::main})}">
<body>
<main th:fragment="main">
    <div class="mb-3">
        <a class="text-decoration-none text-muted small" th:href="@{/books}">&larr; Back to catalog</a>
    </div>
    <div class="app-detail-hero">
        <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="app-pill app-pill-category" th:text="${book.category()}">Cat</span>
            <span class="app-pill app-pill-lang" th:text="${book.language()}">Lang</span>
        </div>
        <h1 class="app-page-title display-6 mb-3" th:text="${book.title()}">Title</h1>
        <p class="lead text-muted mb-4" th:text="${book.author()}">Author</p>
        <div class="row g-4">
            <div class="col-sm-6 col-lg-4">
                <div class="small text-muted text-uppercase fw-semibold mb-1">ISBN</div>
                <div th:text="${book.isbn() ?: '—'}">—</div>
            </div>
            <div class="col-sm-6 col-lg-4">
                <div class="small text-muted text-uppercase fw-semibold mb-1">Price</div>
                <div class="app-price" th:text="'$' + ${#numbers.formatDecimal(book.price(), 1, 2)}">$0</div>
            </div>
            <div class="col-sm-6 col-lg-4">
                <div class="small text-muted text-uppercase fw-semibold mb-1">Stock</div>
                <div th:text="${book.stock()}">0</div>
            </div>
        </div>
        <div sec:authorize="hasRole('ADMIN')" class="mt-4 pt-4 border-top d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary rounded-pill" th:href="@{/books/{id}/edit(id=${book.id()})}">Edit</a>
            <form class="d-inline" th:action="@{/books/{id}/delete(id=${book.id()})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger rounded-pill"
                        onclick="return confirm('Delete this book?');">Delete
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
