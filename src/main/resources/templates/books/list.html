<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Catalog', ~{::main})}">
<body>
<main th:fragment="main">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
        <div>
            <h1 class="app-page-title h2 mb-1">Browse the catalog</h1>
            <p class="text-muted mb-0 small">Filter by category and language, or search titles.</p>
        </div>
    </div>

    <div class="app-filter-card mb-4">
        <form class="row g-3 align-items-end" th:action="@{/books}" method="get">
            <input type="hidden" name="sort" th:value="${sort}"/>
            <div class="col-12 col-md-3">
                <label class="form-label small text-muted mb-1">Category</label>
                <select name="category" class="form-select">
                    <option value="">All categories</option>
                    <option th:each="c : ${catalogCategories}" th:value="${c}" th:text="${c}"
                            th:selected="${c == category}"></option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label small text-muted mb-1">Language</label>
                <select name="language" class="form-select">
                    <option value="">All languages</option>
                    <option th:each="lang : ${catalogLanguages}" th:value="${lang}" th:text="${lang}"
                            th:selected="${lang == language}"></option>
                </select>
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label small text-muted mb-1">Title search</label>
                <input class="form-control" name="q" placeholder="Keyword in title…" th:value="${q}"/>
            </div>
            <div class="col-12 col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1">Apply</button>
                <a class="btn btn-outline-secondary" th:href="@{/books}">Reset</a>
            </div>
        </form>
    </div>

    <p class="text-muted small mb-3" th:if="${page.totalElements > 0}">
        Showing <strong th:text="${page.numberOfElements}">0</strong> of
        <strong th:text="${page.totalElements}">0</strong> books
    </p>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${page.totalElements > 0}">
        <div class="col" th:each="b : ${page.content}">
            <div class="card app-book-card">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex flex-wrap gap-1 mb-2">
                        <span class="app-pill app-pill-category" th:text="${b.category()}">Cat</span>
                        <span class="app-pill app-pill-lang" th:text="${b.language()}">Lang</span>
                        <span class="badge text-bg-warning app-low-stock" th:if="${b.stock() &lt; 6 and b.stock() > 0}">Low stock</span>
                        <span class="badge text-bg-secondary app-low-stock" th:if="${b.stock() == 0}">Out of stock</span>
                    </div>
                    <h2 class="card-title mb-1">
                        <a th:href="@{/books/{id}(id=${b.id()})}" th:text="${b.title()}">Title</a>
                    </h2>
                    <p class="text-muted small mb-3" th:text="${b.author()}">Author</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="app-price" th:text="'$' + ${#numbers.formatDecimal(b.price(), 1, 2)}">$0</span>
                        <span class="small text-muted"><span th:text="${b.stock()}">0</span> in stock</span>
                    </div>
                    <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-2 mt-3 pt-3 border-top border-light">
                        <a class="btn btn-sm btn-outline-secondary flex-grow-1"
                           th:href="@{/books/{id}/edit(id=${b.id()})}">Edit</a>
                        <form class="flex-grow-1" th:action="@{/books/{id}/delete(id=${b.id()})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100"
                                    onclick="return confirm('Delete this book?');">Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-light border text-center py-5 rounded-4" th:if="${page.totalElements == 0}">
        <p class="mb-0 text-muted">No books match your filters. Try resetting or broadening your search.</p>
    </div>

    <nav class="mt-4" th:if="${page.totalPages > 1}">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                <a class="page-link"
                   th:href="@{/books(page=${page.number - 1}, size=${page.size}, category=${category}, language=${language}, q=${q}, sort=${sort})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Page ' + ${page.number + 1} + ' / ' + ${page.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                <a class="page-link"
                   th:href="@{/books(page=${page.number + 1}, size=${page.size}, category=${category}, language=${language}, q=${q}, sort=${sort})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
